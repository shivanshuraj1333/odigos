# Prometheus + Grafana quickstart for the Odigos memory-profiler demo.
#
#   # 1) create the dashboard configmap from the JSON in this dir:
#   kubectl create namespace monitoring
#   kubectl -n monitoring create configmap memprof-dashboard \
#       --from-file=memprof-dashboard.json=deploy/grafana/memprof-dashboard.json
#   # 2) apply this manifest:
#   kubectl apply -f deploy/grafana/monitoring.yaml
#   # 3) view:
#   kubectl -n monitoring port-forward svc/grafana 3000:3000   # admin/admin
#
# Prometheus auto-discovers any pod exposing a container port 8888 (the node
# collector's profiler metrics endpoint, enabled by profiling.memory.metrics=true).
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus-memprof }
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus-memprof }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-memprof }
subjects: [ { kind: ServiceAccount, name: prometheus, namespace: monitoring } ]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: monitoring }
data:
  prometheus.yml: |
    global: { scrape_interval: 10s }
    scrape_configs:
      - job_name: odigos-memprof
        kubernetes_sd_configs: [ { role: pod } ]
        relabel_configs:
          # keep only pods exposing a container port named/numbered 8888
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "8888"
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2h"]
          ports: [ { containerPort: 9090 } ]
          volumeMounts: [ { name: config, mountPath: /etc/prometheus } ]
      volumes: [ { name: config, configMap: { name: prometheus-config } } ]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: monitoring }
spec:
  selector: { app: prometheus }
  ports: [ { port: 9090, targetPort: 9090 } ]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-provisioning, namespace: monitoring }
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
      - name: Pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://pyroscope.memprof-sys.svc:4040
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: memprof
        folder: Odigos
        type: file
        options: { path: /var/lib/grafana/dashboards }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
            - { name: GF_INSTALL_PLUGINS, value: grafana-pyroscope-app }
          ports: [ { containerPort: 3000 } ]
          volumeMounts:
            - { name: provisioning-ds, mountPath: /etc/grafana/provisioning/datasources }
            - { name: provisioning-db, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - { name: provisioning-ds, configMap: { name: grafana-provisioning, items: [ { key: datasource.yaml, path: datasource.yaml } ] } }
        - { name: provisioning-db, configMap: { name: grafana-provisioning, items: [ { key: dashboards.yaml, path: dashboards.yaml } ] } }
        - { name: dashboards, configMap: { name: memprof-dashboard } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: monitoring }
spec:
  selector: { app: grafana }
  ports: [ { port: 3000, targetPort: 3000 } ]
